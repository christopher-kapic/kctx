name: PR checks

on:
  pull_request:
    branches: [main, master]
    # `ready_for_review` is load-bearing: the jobs below skip while the PR is a
    # draft, and a skipped required check satisfies a ruleset. Without this type
    # a PR opened as a draft and then marked ready would be mergeable with every
    # check skipped.
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel superseded runs when a PR is force-pushed.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege token: PR checks only read the repo.
permissions:
  contents: read

jobs:
  # Shared setup: install dependencies once and cache for downstream jobs.
  setup:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Saved under this exact SHA, with no restore-keys, and every job below
      # `needs: setup` — so a restore MISS downstream is never "not cached yet",
      # it means this save failed or the entry was evicted. Those jobs therefore
      # set `fail-on-cache-miss: true`: without it they run with no node_modules
      # and fail with `biome: not found`, which sends you looking in the wrong
      # place.
      - name: Cache workspace
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/db/prisma/generated
          key: workspace-${{ github.sha }}

  # ── Validation jobs (all depend on setup) ──────────────────────────

  lint:
    name: Lint & format
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - name: Restore workspace
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/db/prisma/generated
          key: workspace-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Lint & format check
        run: pnpm check:ci

      # Every key in a packages/env Zod schema must be described in
      # scripts/lib/env-manifest.ts, and the generated .env.example files must
      # match it. Without this, a new env var silently goes missing from
      # `pnpm generate:secrets` and surfaces as a production boot failure.
      - name: Environment manifest check
        run: pnpm env:check

      # packages/env validation modules must never load a .env file: they run in
      # the web SSR graph, and a dotenv import there becomes an unresolvable Vite
      # SSR external that only fails in a built container. Loading happens in
      # @starter/env/{load-dotenv,root-env}, called from process entrypoints
      # only. Typecheck, lint, and tests all pass while this is violated — which
      # is why it is a gate. See scripts/check-load-dotenv-contract.ts.
      - name: Env load/validate contract check
        run: pnpm env:check-entrypoints

      # The three Dockerfiles hand-enumerate a `COPY <member>/package.json` line
      # for every workspace member, ahead of `pnpm install --frozen-lockfile`.
      # Add a packages/* or apps/* member and forget its line and `docker build`
      # fails at install time — invisible to `pnpm build`/tests. This gate makes
      # the omission a fast error instead. See scripts/check-docker-copy.ts.
      - name: Dockerfile COPY-list check
        run: pnpm docker:check-copy

      # Code comments AND the docs themselves cite pattern docs by section
      # (`patterns/foo.md § Bar`). When a doc is restructured the citation
      # silently rots — the file still exists, but the named section is gone.
      # This gate asserts every cited `§ <section>` resolves to a real heading.
      # A citation to a doc that is entirely absent only warns, so deleting
      # `patterns/` after onboarding doesn't fail a consumer's CI.
      # See scripts/check-doc-citations.ts.
      - name: Doc-citation check
        run: pnpm docs:check-citations

      # `minimumReleaseAgeExclude` exempts a package from the supply-chain
      # age gate. Those exemptions are taken during a security window (the
      # only patched version is younger than the window) and are supposed to
      # be removed once the version ages in — but nothing forces that, so a
      # one-week hole silently becomes permanent. This gate enforces the
      # `drop-after:` date on each entry.
      # See scripts/check-release-age-excludes.ts.
      - name: Release-age exclude expiry
        run: pnpm deps:check-excludes

  typecheck:
    name: Type check
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - name: Restore workspace
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/db/prisma/generated
          key: workspace-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Type check
        run: pnpm check-types

  build:
    name: Build
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - name: Restore workspace
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/db/prisma/generated
          key: workspace-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Build
        run: pnpm build

  test:
    name: Test
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - name: Restore workspace
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/db/prisma/generated
          key: workspace-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Test
        run: pnpm test

  # ── Agent docs drift check ─────────────────────────────────────────

  agent-docs:
    name: Agent docs in sync
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - name: Restore workspace
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/db/prisma/generated
          key: workspace-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Regenerate agent docs
        run: pnpm sync:agent-docs

      - name: Check for drift
        run: |
          if ! git diff --exit-code CLAUDE.md .cursorrules .github/copilot-instructions.md; then
            echo "::error::Agent docs are out of sync with AGENTS.md. Run 'pnpm sync:agent-docs' and commit the result."
            exit 1
          fi

  # ── Policy checks (grep-based, enforce CLAUDE.md rules) ───────────

  policy-checks:
    name: Policy checks
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - name: Restore workspace
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/db/prisma/generated
          key: workspace-${{ github.sha }}
          fail-on-cache-miss: true

      # Enforcement only, per PR. The tooling's own self-tests (which prove
      # the checkers still catch what they claim to catch) do NOT run here:
      # they are maintainer-facing verification of the template's guard
      # machinery, they run nightly (.github/workflows/nightly-tooling.yml,
      # `pnpm verify:tooling`) and at release (`pnpm verify`) — keeping them
      # off every PR also keeps them off every app built from this template.
      - name: Grep policy checks (AGENTS.md guardrails)
        run: |
          pnpm policy:checks
          pnpm policy:local-db-guard
          pnpm policy:db-applier-state
          pnpm policy:backup-writer

      - name: Agent docs size budget
        run: pnpm policy:agents-size

      - name: Test colocation
        run: pnpm policy:test-colocation

      - name: Queue wiring
        run: pnpm policy:queue-wiring

      - name: Access matrix enforcement (when notes exist)
        run: pnpm policy:access-matrix

      # Enforcement only — the schema-diff checker's own self-test runs in
      # the nightly tooling job, not per PR.
      - name: Schema destructive diff
        env:
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm policy:schema-diff

  # ── Prisma schema validation ──────────────────────────────────────

  prisma-validate:
    name: Prisma validate
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - name: Restore workspace
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/db/prisma/generated
          key: workspace-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Validate schema
        run: pnpm -F @starter/db exec prisma validate

      - name: Check schema formatting
        run: pnpm -F @starter/db exec prisma format --check

  # ── React Doctor (React health scan: hooks, a11y, perf, security) ─

  react-doctor:
    name: React Doctor
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Required for --scope changed: react-doctor uses `git merge-base` to find
          # the common ancestor with the base branch.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - name: Restore workspace
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/db/prisma/generated
          key: workspace-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Run react-doctor (changed files only)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          pnpm exec react-doctor . \
            --scope changed \
            --base "origin/${BASE_REF}" \
            --annotations \
            --offline \
            -y

  # ── Knip (unused exports & dependencies) ───────────────────────────

  knip:
    name: Unused code check
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - name: Restore workspace
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/db/prisma/generated
          key: workspace-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Knip
        run: pnpm knip

  # ── pnpm audit (known-CVE check against the lockfile) ─────────────

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      # pnpm audit reads pnpm-lock.yaml directly — no install needed.
      #
      # Threshold is `high`: lockfile is clean of high+ advisories. The
      # remaining moderates are tracked via Dependabot. Bump to `moderate`
      # once those are cleared.
      - name: pnpm audit
        run: pnpm audit --audit-level=high

  # ── Secret scanning (always-on for non-draft PRs) ─────────────────

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # This job intentionally has no workspace install: both gates are
      # standalone Node/Bash programs. Pin the runtime here rather than
      # relying on a runner-default Node or pnpm from another job.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - name: TruffleHog OSS
        run: |
          set -euo pipefail
          bash scripts/trufflehog-pr-scan.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Template secret patterns
        run: |
          set -euo pipefail
          node scripts/check-template-secret-patterns.mjs --self-test
          node scripts/check-template-secret-patterns.mjs

  # ── Docker image build ────────────────────────────────────────────

  # A matrix job publishes one status check per leg — `Docker image build (app)`
  # and siblings — so the bare `Docker image build` context a branch ruleset can
  # require would never appear. The legs are named explicitly here, and the
  # `docker-gate` job below publishes the single required context.
  docker:
    name: Docker image build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            dockerfile: ./Dockerfile
          - image: worker
            dockerfile: ./Dockerfile.worker
          - image: db-applier
            dockerfile: ./Dockerfile.db-applier
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Passed as APT_CACHE_DATE so the base stage's `apt-get upgrade` layer is
      # rebuilt at most daily instead of being frozen in the buildx cache —
      # otherwise Trivy fails on OS patches Debian shipped after the layer was
      # first cached (see the ARG comment in the Dockerfiles).
      - name: Compute apt cache-bust date
        id: apt-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ github.event.repository.name }}-${{ matrix.image }}-pr:${{ github.sha }}
          build-args: |
            APT_CACHE_DATE=${{ steps.apt-date.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false

      - name: Reclaim ephemeral Buildx cache before Trivy
        run: |
          set -euo pipefail
          docker buildx prune -f --max-used-space 512MB || docker builder prune -f

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ github.event.repository.name }}-${{ matrix.image }}-pr:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table

  # ── Required status check for the Docker matrix ───────────────────────

  # This aggregates the matrix legs above so a human-facing status identifies
  # the Docker failure, while the required PR aggregate below also inspects the
  # underlying `docker` result directly.
  #
  # `if: always()` so a failed leg cannot be laundered into a skipped gate. A
  # draft PR skips the `docker` job entirely; `skipped` is treated as a pass here
  # exactly as GitHub treats a skipped required check.
  docker-gate:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: docker
    if: always()
    steps:
      - name: Require every image build to have passed
        env:
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          set -euo pipefail
          case "$DOCKER_RESULT" in
            success)
              echo "All Docker image builds passed."
              ;;
            skipped)
              echo "Docker image builds were skipped (draft PR) — nothing to gate."
              ;;
            *)
              echo "::error::Docker image build did not pass (result: $DOCKER_RESULT). Open the 'Docker image build (<image>)' checks for the failing leg."
              exit 1
              ;;
          esac

  # ── Required PR validation aggregate ─────────────────────────────────

  # Required checks marked "skipped" satisfy GitHub rulesets. A failed setup
  # therefore cannot be left to its skipped dependents: this job always runs,
  # reads the setup and every validation result, and accepts skips only when
  # the pull request itself is a draft. `.github/rulesets/main.json` requires
  # this one stable context rather than a list of jobs that GitHub could mark
  # skipped before they performed validation.
  pr-validation:
    name: PR validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - setup
      - lint
      - typecheck
      - build
      - test
      - agent-docs
      - policy-checks
      - prisma-validate
      - react-doctor
      - knip
      - pnpm-audit
      - secret-scan
      - docker
      - docker-gate
    if: always()
    steps:
      - name: Require successful validation for ready pull requests
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          SETUP_RESULT: ${{ needs['setup'].result }}
          LINT_RESULT: ${{ needs['lint'].result }}
          TYPECHECK_RESULT: ${{ needs['typecheck'].result }}
          BUILD_RESULT: ${{ needs['build'].result }}
          TEST_RESULT: ${{ needs['test'].result }}
          AGENT_DOCS_RESULT: ${{ needs['agent-docs'].result }}
          POLICY_CHECKS_RESULT: ${{ needs['policy-checks'].result }}
          PRISMA_VALIDATE_RESULT: ${{ needs['prisma-validate'].result }}
          REACT_DOCTOR_RESULT: ${{ needs['react-doctor'].result }}
          KNIP_RESULT: ${{ needs['knip'].result }}
          PNPM_AUDIT_RESULT: ${{ needs['pnpm-audit'].result }}
          SECRET_SCAN_RESULT: ${{ needs['secret-scan'].result }}
          DOCKER_RESULT: ${{ needs['docker'].result }}
          DOCKER_GATE_RESULT: ${{ needs['docker-gate'].result }}
        run: |
          set -euo pipefail
          if [ "$IS_DRAFT" = "true" ]; then
            echo "Draft pull request — validation jobs are intentionally skipped."
            exit 0
          fi

          for result in \
            "$SETUP_RESULT" \
            "$LINT_RESULT" \
            "$TYPECHECK_RESULT" \
            "$BUILD_RESULT" \
            "$TEST_RESULT" \
            "$AGENT_DOCS_RESULT" \
            "$POLICY_CHECKS_RESULT" \
            "$PRISMA_VALIDATE_RESULT" \
            "$REACT_DOCTOR_RESULT" \
            "$KNIP_RESULT" \
            "$PNPM_AUDIT_RESULT" \
            "$SECRET_SCAN_RESULT" \
            "$DOCKER_RESULT" \
            "$DOCKER_GATE_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::A required setup or validation job did not succeed (result: $result)."
              exit 1
            fi
          done
          echo "Setup and every validation job succeeded."
