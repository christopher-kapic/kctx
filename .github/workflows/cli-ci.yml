# Continuous integration for the companion Rust CLI (`apps/cli`).
# Every job runs cargo from `apps/cli`; the Node/pnpm checks live in
# pr-checks.yml. Release builds live in release.yml; this file is
# hand-maintained.
#
# Removing the CLI? Delete this file along with apps/cli — see
# patterns/removable/cli.md.
name: CLI CI

on:
  push:
    branches: [main, master]
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
  schedule:
    # Check RustSec advisories regularly without making unrelated PRs flaky.
    - cron: "17 9 * * 1"
  workflow_dispatch:

# Least-privilege by default.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: cli-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/cli

env:
  CARGO_TERM_COLOR: always
  # Treat all warnings as errors across the whole workspace.
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Tests on every OS we ship to ────────────────────────────────────────────
  test:
    name: test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/cli -> target
      - run: cargo test --workspace --all-targets --locked
      # `--all-targets` skips doctests; run them explicitly.
      - run: cargo test --workspace --doc --locked

  # ── Formatting ──────────────────────────────────────────────────────────────
  fmt:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  # ── Lint (warnings are errors via RUSTFLAGS) ────────────────────────────────
  clippy:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/cli -> target
      - run: cargo clippy --workspace --all-targets --all-features --locked

  # ── Minimum Supported Rust Version still builds ─────────────────────────────
  msrv:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    # New compiler lints shouldn't fail the MSRV build; only compilation matters.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keep this in sync with `rust-version` in apps/cli/Cargo.toml.
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/cli -> target
      - run: cargo build --workspace --locked

  # ── Supply chain: licenses, bans, and sources ───────────────────────────────
  # Keep deterministic policy checks blocking on PRs. RUSTSEC advisories run in
  # the scheduled job below so new disclosures do not break unrelated PRs.
  deny:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources
          arguments: --config apps/cli/deny.toml
          command-arguments: ""
          manifest-path: apps/cli/Cargo.toml

  # ── RustSec advisories ─────────────────────────────────────────────────────
  advisories:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
          arguments: --config apps/cli/deny.toml
          command-arguments: ""
          manifest-path: apps/cli/Cargo.toml

  # ── Agent docs are in sync with apps/cli/AGENTS.md ──────────────────────────
  docs-drift:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/cli -> target
      - run: cargo xtask sync-docs --check

  # ── Spell check (scoped to apps/cli by its typos.toml) ──────────────────────
  typos:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: typos-cli
      - run: typos

  # ── Project policy greps (things the compiler/clippy can't see) ─────────────
  # Secret scanning for the whole repo (TruffleHog) runs in pr-checks.yml.
  policy:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/policy-checks.sh
